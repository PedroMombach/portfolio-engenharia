[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "curveextractor-mk2"
version = "1.0.0"
description = "Manual curve digitizer with affine calibration"
requires-python = ">=3.12"
dependencies = ["PySide6-Essentials>=6.8,<7", "pypdfium2>=4,<6", "numpy>=2,<3", "scipy>=1.14,<2", "Pillow>=11,<13", "XlsxWriter>=3,<4"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4", "ruff>=0.11", "matplotlib>=3.8"]

[project.gui-scripts]
curveextractor = "curveextractor.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
